name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sesgo-ti/.github/.github/actions/setup-maven@v1
        env:
          MAVEN_ACTOR: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.HUBSAUDE_MAVEN_READ_TOKEN }}
      - name: Verificar build e qualidade
        run: mvn -B -ntp clean verify -Pquality
        env:
          MAVEN_ACTOR: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.HUBSAUDE_MAVEN_READ_TOKEN }}
      - name: Testar JAR executável
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          java -jar "target/hubsaude-cliente-cli-${VERSION}.jar" --help
      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
