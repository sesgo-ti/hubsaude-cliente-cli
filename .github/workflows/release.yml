name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sesgo-ti/.github/.github/actions/setup-maven@4162afa0ed30ad31cc2f18d3422d7202702be17c # v1.0.0
        env:
          MAVEN_ACTOR: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.HUBSAUDE_MAVEN_READ_TOKEN }}
      - name: Validar tag e construir artefatos
        env:
          MAVEN_ACTOR: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.HUBSAUDE_MAVEN_READ_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in
            *-SNAPSHOT|*[!0-9.]*|.*|*.) exit 1 ;;
          esac
          mvn -B -ntp clean verify -Pquality,release -Drevision="$VERSION"
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/hubsaude-cliente-cli-*.jar \
            target/hubsaude-cliente-cli-*-cyclonedx.json \
            --generate-notes \
            --verify-tag
